# DT3 Commons Platform SDK - Logging Specification
# Version: 1.0.0
# Status: Stable

spec:
  name: logging
  version: "1.0.0"
  status: stable
  description: >
    Defines the structured logging standard for all DT3 Commons SDK implementations.
    All logs are structured events validated against a JSON Schema contract.

principles:
  - All log output must be structured (JSON/object), never unstructured strings
  - Every log entry is a LogEvent conforming to schemas/log-event.schema.json
  - Logging must fail-open by default — errors in logging must not crash the application
  - Masking is applied before export by default
  - Validation mode is configurable (STRICT, LENIENT, OFF)
  - Exporters are pluggable — the logger does not know the destination
  - Multiple sinks may be active concurrently with per-sink failure isolation
  - OpenTelemetry-compatible attribute names are preferred
  - Typed domain events are builders that produce canonical LogEvents
  - EventEmitter.emit routes typed events through Logger.event without replacing it

severity_levels:
  - name: DEBUG
    numeric: 5
    description: Fine-grained debugging information
  - name: INFO
    numeric: 9
    description: Normal operational events
  - name: WARN
    numeric: 13
    description: Potentially harmful situations
  - name: ERROR
    numeric: 17
    description: Error events that allow continued operation
  - name: FATAL
    numeric: 21
    description: Severe errors causing premature termination

logger_interface:
  methods:
    - name: debug
      parameters:
        - name: message
          type: string
          required: true
        - name: context
          type: map<string, any>
          required: false
    - name: info
      parameters:
        - name: message
          type: string
          required: true
        - name: context
          type: map<string, any>
          required: false
    - name: warn
      parameters:
        - name: message
          type: string
          required: true
        - name: context
          type: map<string, any>
          required: false
    - name: error
      parameters:
        - name: message
          type: string
          required: true
        - name: error
          type: error_object
          required: false
        - name: context
          type: map<string, any>
          required: false
    - name: event
      parameters:
        - name: event_object
          type: LogEvent
          required: true
    - name: startTimer
      parameters:
        - name: event_name
          type: string
          required: true
        - name: context
          type: map<string, any>
          required: false
      returns: Timer
    - name: flush
      description: Flush all pending log events to exporters
    - name: registerSink
      parameters:
        - name: sink
          type: EventSink
          required: true
      description: Register an additional export sink for fan-out

event_emitter:
  description: >
    Optional typed emitter that accepts domain/AI builder outputs and
    forwards canonical LogEvents to Logger.event.
  methods:
    - name: emit
      parameters:
        - name: event_object
          type: LogEvent | DomainEvent
          required: true

sink_interface:
  description: >
    Pluggable export destination. Python/Node use export/flush/close;
    Java LogTransport uses write/flush/shutdown.
  methods:
    - name: export
      description: Deliver one processed LogEvent
    - name: flush
      description: Flush buffered sink state
    - name: close
      description: Release sink resources (idempotent)

pipeline:
  description: >
    Every log event flows through the processing pipeline before export.
  stages:
    - name: EventFactory
      description: Creates a structured LogEvent from logger method call; auto-sets event.id when absent
    - name: EnrichmentProcessor
      description: Adds service metadata, trace context, tenant context, timestamps
    - name: MaskingProcessor
      description: Applies recursive sensitive-data masking
    - name: ValidationProcessor
      description: Validates event against JSON Schema
    - name: BatchingProcessor
      description: Batches events for efficient export
    - name: MultiSinkFanout
      description: Writes events to one or more sinks with per-sink failure isolation

event_naming:
  convention: UPPER_SNAKE_CASE
  examples:
    - USER_LOGIN_COMPLETED
    - ORDER_CREATED
    - PAYMENT_PROCESSED
    - OUTGOING_HTTP
    - INCOMING_HTTP
    - WORKER_JOB_STARTED
    - WORKER_JOB_COMPLETED
    - DB_QUERY_COMPLETED
    - AI_PROMPT_SUBMITTED
    - AI_RESPONSE_RECEIVED
  rules:
    - event.name is required on every log event
    - Names should be descriptive and action-oriented
    - Use domain prefix for business events (e.g., ORDER_CREATED)
    - Use technical prefix for infrastructure events (e.g., OUTGOING_HTTP)
