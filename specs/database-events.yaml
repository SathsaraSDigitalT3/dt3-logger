spec:
  name: database-events
  version: "1.0.0"
  status: stable
  description: >
    Typed database event contracts for DT3 Commons.
    Builders produce canonical LogEvent maps with db.* attributes.

event_names:
  - DB_QUERY_STARTED
  - DB_QUERY_COMPLETED
  - DB_QUERY_FAILED

attributes:
  - name: db.system
    type: string
    description: Database system identifier (e.g. postgresql, mysql, mongodb)
    required: false
  - name: db.operation
    type: string
    description: Database operation name (e.g. SELECT, INSERT, FIND)
    required: false
  - name: db.name
    type: string
    description: Database name
    required: false
  - name: db.sql.table
    type: string
    description: Primary table name when applicable
    required: false
  - name: duration.ms
    type: number
    description: Query duration in milliseconds
    required: false

notes:
  - SQL text and credentials must never be logged unmasked
