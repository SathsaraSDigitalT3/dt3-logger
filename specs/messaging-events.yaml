spec:
  name: messaging-events
  version: "1.0.0"
  status: stable
  description: >
    Typed messaging and worker event contracts for DT3 Commons.
    Aligns with specs/workers.yaml lifecycle event names.

event_names:
  - WORKER_JOB_RECEIVED
  - WORKER_JOB_STARTED
  - WORKER_JOB_COMPLETED
  - WORKER_JOB_FAILED
  - WORKER_JOB_RETRIED
  - MESSAGING_PUBLISH
  - MESSAGING_RECEIVE

attributes:
  - name: messaging.system
    type: string
    description: Messaging system (e.g. kafka, sqs, rabbitmq)
    required: false
  - name: messaging.destination
    type: string
    description: Topic, queue, or destination name
    required: false
  - name: messaging.operation
    type: string
    description: publish, receive, process
    required: false
  - name: messaging.message.id
    type: string
    description: Message or job identifier
    required: false
  - name: duration.ms
    type: number
    description: Processing duration in milliseconds
    required: false

envelope:
  description: >
    For async transport, schemas/event-envelope.schema.json may wrap a LogEvent
    payload. The log pipeline itself always uses the canonical log-event contract.
