    required: false
    source: Kavia
  - name: kavia.context_window.size
    type: integer
    description: Context window size
    required: false
    source: Kavia
  - name: kavia.memory.bytes
    type: integer
    description: Memory bytes
    required: false
    source: Kavia
  - name: kavia.conversation.id
    type: string
    description: Conversation identifier
    required: false
    source: Kavia
  - name: kavia.agent.id
    type: string
    description: Agent identifier
    required: false
    source: Kavia
  - name: kavia.request.id
    type: string
