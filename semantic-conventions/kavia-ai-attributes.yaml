attributes:
  - name: kavia.provider
    type: string
    description: AI model provider
    required: false
    source: Kavia
  - name: kavia.model
    type: string
    description: Model identifier
    required: false
    source: Kavia
  - name: kavia.model.version
    type: string
    description: Model version
    required: false
    source: Kavia
  - name: kavia.prompt
    type: string
    description: Prompt payload (sensitive)
    required: false
    source: Kavia
  - name: kavia.response
    type: string
    description: Response payload (sensitive)
    required: false
    source: Kavia
  - name: kavia.tokens.prompt
    type: integer
    description: Prompt token count
    required: false
    source: Kavia
  - name: kavia.tokens.completion
    type: integer
    description: Completion token count
    required: false
    source: Kavia
  - name: kavia.tokens.total
    type: integer
    description: Total token count
    required: false
    source: Kavia
  - name: kavia.latency.ms
    type: number
