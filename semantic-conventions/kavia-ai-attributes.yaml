    required: false
    source: Kavia
  - name: kavia.finish_reason
    type: string
    description: Finish reason
    required: false
    source: Kavia
  - name: kavia.cache.hit
    type: boolean
    description: Cache hit indicator
    required: false
    source: Kavia
  - name: kavia.temperature
    type: number
