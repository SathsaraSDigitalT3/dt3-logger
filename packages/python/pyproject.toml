[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dt3-commons"
version = "0.1.0"
description = "DT3 Commons Platform SDK for Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[tool.setuptools]
packages = ["dt3_api", "dt3_sdk", "dt3_sdk.impl", "dt3_sdk.events"]

[tool.setuptools.package-data]
dt3_sdk = ["log-event.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
