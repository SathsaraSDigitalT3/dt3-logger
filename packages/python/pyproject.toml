[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dt3-commons"
version = "0.1.0"
description = "DT3 Commons Platform SDK for Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]
